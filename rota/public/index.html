<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plan samen een reis: route, verblijf, activiteiten en dagplanning, met stemmen en Claude als reisassistent.">
<meta name="theme-color" content="#2348A6">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}.scrim.rota-gate{z-index:90;align-items:center;justify-content:center}.sheet.rota-gate-sheet{height:auto;max-height:92%;border-radius:18px;margin:16px}body.rota-solo .top,body.rota-solo main,body.rota-solo #fab{display:none!important}body.rota-solo .scrim.rota-gate{background:transparent}</style>
<title>Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header with azulejo band, tab bar (bottom on phone, top on desktop), one view at a time, slide-over sheet for detail. */
:root{
  --bg:#F3F6F7;          /* whitewash with a hint of Atlantic */
  --surface:#FFFFFF;
  --sunken:#E8EEF0;
  --ink:#14232C;
  --muted:#5A6B74;
  --line:#D5DEE2;
  --azulejo:#2348A6;     /* cobalt tile blue — primary */
  --azulejo-soft:#E3E9F8;
  --ochre:#D7832F;       /* Ponta da Piedade sandstone — accent */
  --ochre-soft:#FBEBDB;
  --sea:#0E7A83;         /* planned */
  --sea-soft:#DDF1F2;
  --ok:#2E7D4F;          /* booked */
  --ok-soft:#DFF2E6;
  --no:#B3412F;
  --no-soft:#F8E1DC;
  --shadow:0 1px 2px rgba(20,35,44,.06),0 6px 20px rgba(20,35,44,.06);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E171C;--surface:#16222A;--sunken:#1D2C35;--ink:#E7EEF1;--muted:#93A6AF;--line:#2A3C46;
  --azulejo:#7F9DF0;--azulejo-soft:#1E2B4D;--ochre:#EFA25A;--ochre-soft:#3A2814;
  --sea:#4FC1C9;--sea-soft:#123437;--ok:#6CC892;--ok-soft:#163323;--no:#F08A78;--no-soft:#3C1E19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171C;--surface:#16222A;--sunken:#1D2C35;--ink:#E7EEF1;--muted:#93A6AF;--line:#2A3C46;
  --azulejo:#7F9DF0;--azulejo-soft:#1E2B4D;--ochre:#EFA25A;--ochre-soft:#3A2814;
  --sea:#4FC1C9;--sea-soft:#123437;--ok:#6CC892;--ok-soft:#163323;--no:#F08A78;--no-soft:#3C1E19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--azulejo)}
:focus-visible{outline:2px solid var(--azulejo);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.tiles{height:10px;background-color:var(--azulejo);
  background-image:
    radial-gradient(circle at 50% 50%,var(--bg) 0 2px,transparent 2.5px),
    linear-gradient(45deg,transparent 42%,var(--bg) 42% 58%,transparent 58%),
    linear-gradient(-45deg,transparent 42%,var(--bg) 42% 58%,transparent 58%);
  background-size:20px 10px;opacity:.9}
.bar{max-width:1080px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{font-size:24px;white-space:nowrap}
.brand .tripname{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crew{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);background:var(--sunken);object-fit:cover;flex:none;position:relative}
.crew .avwrap{position:relative;margin-left:-8px}
.crew .avwrap:first-child{margin-left:0}
.crew .online::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.crew .more{margin-left:6px;font-size:12.5px;color:var(--muted)}

.tabs{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 12px 11px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ochre)}
.tab .count{background:var(--ochre);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.view{display:flex;flex-direction:column;gap:20px}

@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;max-width:none;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;border-bottom:0;border-top:2px solid transparent;position:relative;flex:1}
  .tab[aria-selected="true"]{border-top-color:var(--ochre)}
  .tab .count{position:absolute;top:2px;left:55%}
  .brand h1{font-size:21px}
}

/* ---------- generic pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg,.chip svg,.linkish svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--azulejo);border-color:var(--azulejo);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.voorstel{background:var(--ochre-soft);color:var(--ochre)}
.pill.gepland{background:var(--sea-soft);color:var(--sea)}
.pill.geboekt{background:var(--ok-soft);color:var(--ok)}
.pill.afgevallen{background:var(--sunken);color:var(--muted)}
.pill.claude{background:var(--azulejo-soft);color:var(--azulejo)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.cat svg{width:14px;height:14px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--azulejo-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--azulejo)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:4px}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:22px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.countdown{padding:20px;position:relative;overflow:hidden}
.countdown .big{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--azulejo)}
.countdown .big small{font-size:20px;color:var(--ink);margin-left:6px}
.countdown .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.countdown .meta div{min-width:0}
.countdown .meta b{display:block;font-size:17px;font-weight:600}
.countdown .cliff{position:absolute;right:-10px;bottom:-6px;width:170px;height:auto;opacity:.9;pointer-events:none}
@media (max-width:480px){.countdown .cliff{width:110px;opacity:.45}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px}
.stat b{font-family:var(--f-display);font-size:30px;line-height:1.1;display:block}
.stat.s1 b{color:var(--ochre)}.stat.s2 b{color:var(--sea)}.stat.s3 b{color:var(--ok)}
.budget{padding:14px;grid-column:1/-1}
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:8px;display:flex}
.meter i{display:block;height:100%}
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.todo-list,.feed{display:flex;flex-direction:column}
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .t{flex:1;min-width:0}
.todo .t>*{display:block;max-width:100%}
.todo .t .linkish{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .item{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.feed .item:first-child{border-top:0}
.feed .item .av{width:24px;height:24px;border:0}
.feed .item .txt{min-width:0;flex:1}
.feed .item .txt q{quotes:none;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--ink)}
.climate{padding:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.climate div b{font-size:20px;font-weight:700;display:block}

/* ---------- vote control ---------- */
.vote{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.vote button{border:0;background:none;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:5px;align-items:center}
.vote button+button{border-left:1px solid var(--line)}
.vote button[aria-pressed="true"].ja{background:var(--ok-soft);color:var(--ok)}
.vote button[aria-pressed="true"].mis{background:var(--ochre-soft);color:var(--ochre)}
.vote button[aria-pressed="true"].nee{background:var(--no-soft);color:var(--no)}
.vote button:disabled{cursor:not-allowed}
.tally{display:flex;height:5px;border-radius:9px;overflow:hidden;background:var(--sunken);min-width:60px}
.tally i{display:block;height:100%}
.tally .j{background:var(--ok)}.tally .m{background:var(--ochre)}.tally .n{background:var(--no)}

/* ---------- board ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--muted)}
.chip svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.idea{display:flex;flex-direction:column;gap:10px;padding:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.idea:hover{border-color:var(--muted)}
.idea.top1{border-color:var(--ochre)}
.idea h3{font-size:18px}
.idea .desc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.idea .facts{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.idea .facts span{display:inline-flex;gap:4px;align-items:center}
.idea .facts svg{width:14px;height:14px}
.idea.afgevallen{opacity:.6}
.who{display:flex}
.who .av{width:22px;height:22px;margin-left:-6px;border:2px solid var(--surface)}
.who .av:first-child{margin-left:0}

/* ---------- plan ---------- */
.plan{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.plan{grid-template-columns:minmax(0,1fr)}}
.pool{padding:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:120px}
@media (max-width:820px){.pool{position:static}}
.days{display:flex;flex-direction:column;gap:14px}
.day{padding:0;overflow:hidden}
.day-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunken)}
.day-h .dnum{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--azulejo);min-width:34px}
.day-h .dname{font-weight:700}
.slot{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.slot:first-of-type{border-top:0}
.slot:hover{background:var(--sunken)}
.slot .time{font-weight:700;width:46px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}
.slot .what{flex:1;min-width:0}
.slot .what b{display:block;font-weight:600}
.day .none{padding:14px;color:var(--muted);font-size:14px}
.mini{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14px}
.mini{text-align:left;color:var(--ink)}
.mini:hover{border-color:var(--muted)}
.mini svg{width:16px;height:16px;flex:none;color:var(--muted)}
.mini:disabled{opacity:.6;cursor:default}
.mini b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop-ok{outline:2px dashed var(--ochre);outline-offset:-2px}

/* ---------- book ---------- */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bk{padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.bk:hover{border-color:var(--azulejo)}
.bk .bk-h{display:flex;align-items:center;gap:8px;font-weight:700}
.bk .bk-h svg{width:18px;height:18px;color:var(--azulejo)}
.bk p{margin:0;color:var(--muted);font-size:13.5px}
.bk .go{margin-top:auto;font-size:13px;font-weight:600;color:var(--azulejo)}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.region{padding:14px;display:flex;flex-direction:column;gap:8px}
.region h3{font-size:19px}
.region p{margin:0;color:var(--muted);font-size:14px}
.region .row{margin-top:auto}
.tripform{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:end}

/* ---------- claude ---------- */
.ai{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.ai{grid-template-columns:minmax(0,1fr)}}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.preset:hover{border-color:var(--azulejo)}
.preset svg{width:20px;height:20px;color:var(--azulejo);flex:none;margin-top:1px}
.preset b{display:block}
.preset span{font-size:13px;color:var(--muted)}
.chat{display:flex;flex-direction:column;min-height:420px}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:62vh}
.msg{max-width:92%;min-width:0}
.msg.me{align-self:flex-end;background:var(--azulejo);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px}
.msg.bot{align-self:flex-start}
.msg.bot .bubble{background:var(--sunken);border-radius:16px 16px 16px 4px;padding:11px 14px;overflow-wrap:anywhere}
.msg.bot .bubble h4{margin:10px 0 4px;font-size:15px}
.msg.bot .bubble p{margin:6px 0}
.msg.bot .bubble ul{margin:6px 0;padding-left:20px}
.msg .thinking{display:inline-flex;gap:4px}
.msg .thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.msg .thinking i:nth-child(2){animation-delay:.2s}.msg .thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.msg .thinking i{animation:none;opacity:.6}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;min-height:42px;max-height:140px}
.sugg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.sugg{padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sugg b{font-weight:700}
.sugg p{margin:0;font-size:13.5px;color:var(--muted)}

/* ---------- route ---------- */
.route-sum{padding:16px;display:flex;flex-direction:column;gap:14px}
.facts4{display:flex;gap:22px;flex-wrap:wrap}
.facts4 b{display:block;font-size:17px;font-weight:600}
.strip{display:flex;gap:3px;min-height:44px}
.strip .rseg{border:0;border-radius:8px;min-width:0;padding:6px 9px;color:var(--bg);text-align:left;display:flex;flex-direction:column;justify-content:center;overflow:hidden;font:inherit}
.strip .rseg b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .rseg span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .rseg.voorstel{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.2) 6px 12px)}
.countdown .strip{margin-top:14px;position:relative;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px;background:var(--muted);margin-right:5px;vertical-align:-1px}
.legend i.striped{background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--bg) 3px 6px)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.stops{display:flex;flex-direction:column}
.stop{padding:16px;display:flex;flex-direction:column;gap:14px}
.stop.vast{border-color:var(--sea)}
.stop-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stop-h .idx{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--bg);flex:none}
.stop-t{min-width:0;flex:1 1 160px}
.stop-t .linkish{font-family:var(--f-display);font-weight:400;font-size:24px;text-decoration:none;line-height:1.15}
.nights{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.nights button{border:0;background:none;width:34px;height:34px;font-size:18px;font-weight:600;color:var(--ink);border-radius:50%}
.nights button:disabled{opacity:.35;cursor:not-allowed}
.nights b{min-width:84px;text-align:center;font-size:14px;font-weight:700}
.ord{display:flex;gap:4px}
.ord .iconbtn{width:32px;height:32px}
.ord .iconbtn:disabled{opacity:.35;cursor:not-allowed}
.leg{display:flex;align-items:center;gap:8px;padding:10px 0 10px 16px;margin-left:16px;border-left:2px dashed var(--line);color:var(--muted);font-size:13px}
.leg svg{width:16px;height:16px;flex:none}
.leg.long{color:var(--ochre)}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.funnel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;font:inherit;color:var(--ink)}
.step:hover{border-color:var(--muted)}
.step .st{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.step .st i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.step.half .st i{border-color:var(--ochre);background:linear-gradient(90deg,var(--ochre) 50%,transparent 50%)}
.step.done .st i{border-color:var(--ok);background:var(--ok)}
.step.done .st i::after{content:"";width:5px;height:3px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.step b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next{padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-color:var(--ochre)}
.next .t{flex:1 1 220px;min-width:0}
.next .t b{display:block;font-size:16px;font-weight:600}
.lvl{display:flex;gap:4px}
.lvl i{width:22px;height:6px;border-radius:9px;background:var(--line)}
.lvl i.on{background:var(--ochre)}
.stop-band{display:flex;align-items:center;gap:10px;padding:4px 2px;margin-top:8px;flex-wrap:wrap;scroll-margin-top:140px}
.stop-band h3{font-size:21px}
.stop-band .dot{width:12px;height:12px}
.mini .dot{margin-left:auto}
.stay-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.stay-row .t{flex:1 1 150px;min-width:0}
.stay-row .t .linkish{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.stay-row.chosen{border-color:var(--sea);background:var(--sea-soft)}
.dayline{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.dayline:first-child{border-top:0}
.dayline .d{width:96px;flex:none;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:8px}
.etappes{display:flex;flex-direction:column;gap:10px}
.etappe-row{padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.etappe-row .t{flex:1 1 200px;min-width:0}
.etappe-row .t b{font-size:16px}
.route-cards{display:flex;flex-direction:column;gap:8px;margin-top:10px}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom,0px);box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
@media (max-width:720px){.scrim{align-items:flex-end}.sheet{height:92%;border-radius:18px 18px 0 0}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
.sheet-h h2{font-size:24px;flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-b{padding:16px 18px 32px;display:flex;flex-direction:column;gap:18px}
.iconbtn{border:0;background:var(--sunken);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.kv b{display:block;font-weight:600;overflow-wrap:anywhere}
.voters{display:flex;flex-direction:column;gap:6px}
.voters .vrow{display:flex;gap:8px;align-items:center;font-size:14px}
.voters .vrow .av{width:24px;height:24px;border:0}
.thread{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt .av{width:28px;height:28px;border:0}
.cmt .body{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.cmt .body p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt.suggestion .body{border-color:var(--ochre);background:var(--ochre-soft)}
.cmt.suggestion.done .body{border-color:var(--line);background:var(--surface)}
.change{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.change span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.change del{color:var(--muted)}
form.f{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;gap:5px;align-items:center;background:var(--surface);cursor:pointer;color:var(--muted)}
.seg span svg{width:14px;height:14px}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--azulejo);outline-offset:2px}
.tabs2{display:flex;gap:6px}
.fab{position:fixed;right:20px;bottom:24px;z-index:25;box-shadow:0 8px 24px rgba(35,72,166,.35);padding:12px 18px;font-size:15px}
@media (max-width:720px){.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:16px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:80;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:720px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--no-soft);border-radius:10px;padding:8px 10px;font-size:14px}

<script>
/* ================================================================
   Rota Algarve — samen een reis plannen zonder groepsapp-chaos.
   Shared state lives in the artifact db:
     trip/main                 reis-instellingen

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
};

/* ---------- icons (inline, stroke) ---------- */
const P = {

/* ---------- domain ---------- */
const CATS = {
  verblijf:  { label: "Verblijf",   icon: "bed" },
  activiteit:{ label: "Activiteit", icon: "boot" },

/* Faro climate: avg day max °C, sea °C (Lagos), sun hours/day */
const CLIMATE = [
  [16,16,5],[17,15,6],[19,16,7],[21,16,9],[23,17,10],[27,19,12],

/* Built-in inspiration: real places, one tap to put on the board */

const STANDALONE = !!window.ROTA_STANDALONE;   // true on the Cloudflare site, false on claude.ai

try { const t = localStorage.getItem("rota-tab"); if (t) S.tab = t; } catch (e) {}

/* ---------- helpers ---------- */

const norm = (x) => String(x || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();

}

function stopRanges(list = sortedStops(), start = S.trip?.start) {

    const r = { stop: st, id: st.id, idx, nights, from: off, start: start ? addDays(start, off) : null, end: start ? addDays(start, off + nights) : null, color: STOPCOL[idx % STOPCOL.length] };

const totalNights = () => S.stops.reduce((a, st) => a + nightsOf(st), 0);
const tripEnd = () => S.stops.length && S.trip?.start ? addDays(S.trip.start, totalNights()) : S.trip?.end;
function rangeForDay(day, ranges = stopRanges(), start = S.trip?.start) {

/* Changes the route (nights, order, places) and moves planned activities along with their stop. */
async function changeRoute(patches, msg, extras = []) {
  if (!guardWrite()) return false;
  const before = stopRanges();
  const kept = S.stops.filter(st => !patches[st.id]?.__delete).map(st => patches[st.id] ? { ...st, ...patches[st.id] } : st);
  const after = stopRanges(sortedStops([...kept, ...extras]));
  if (after.reduce((a, r) => a + r.nights, 0) > 30) { toast("Maximaal 30 nachten, anders wordt de planning onoverzichtelijk."); return false; }

  const moves = [];
  for (const i of S.ideas) {
    const r0 = i.day && S.trip?.start ? rangeForDay(i.day, before) : null;
    if (r0) {
      const r1 = findNew(r0);
      if (!r1) { moves.push([i.id, { day: "", stopId: "", status: i.status === "gepland" ? "voorstel" : i.status }]); continue; }
      const isLast = r1.idx === after.length - 1;

    }

    const r1 = after.find(r => r.id === r0.id);
    return r1 && r0.start && (r0.start !== r1.start || r0.end !== r1.end) && S.ideas.some(i => i.id === r0.stop.stayId && i.status === "geboekt");
  }).map(r => r.stop.place);
  const ok = await write(async () => {
    for (const x of extras) { const { id, ...data } = x; await db.doc("stops/" + id).set(data); }
    for (const [id, p] of Object.entries(patches)) {
      if (p.__delete) await db.doc("stops/" + id).delete();
      else await db.doc("stops/" + id).update({ ...p, updatedAt: now(), updatedBy: S.me });
    }
    for (const [id, p] of moves) await db.doc("ideas/" + id).update({ ...p, updatedAt: now() });

}

  S.routeBusy = true;

    if (inList) { out += "</ul>"; inList = false; }

/* ---------- profiles ---------- */
let profT;
function refreshProfiles() {
  if (!user) return;
  clearTimeout(profT);
  profT = setTimeout(async () => {
    const ids = new Set([...S.members.map(m => m.id), ...S.peers]);
    S.ideas.forEach(i => { if (i.author && i.author !== "claude") ids.add(i.author); if (i.bookedBy) ids.add(i.bookedBy); Object.keys(i.votes || {}).forEach(k => ids.add(k)); });
    S.comments.forEach(c => c.author && ids.add(c.author));
    S.stops.forEach(st => { if (st.createdBy && st.createdBy !== "claude") ids.add(st.createdBy); if (st.lockedBy) ids.add(st.lockedBy); Object.keys(st.votes || {}).forEach(k => ids.add(k)); });
    if (S.me) ids.add(S.me);
    const list = [...ids].filter(Boolean);
    if (!list.length) return;
    try { S.profiles = { ...S.profiles, ...(await user.profiles(list)) }; } catch (e) {}
    render();
  }, 60);
}

/* ---------- boot ---------- */
let rT;
function scheduleRender() { cancelAnimationFrame(rT); rT = requestAnimationFrame(() => { render(); refreshProfiles(); }); }

render();

(async function boot() {
  if (!window.claude?.use) { S.ready.db = true; S.ready.sample = true; render(); return; }
  claude.use("sample").then(s => { sample = s; S.ready.sample = true; if (S.tab === "ai") render(); });
  user = await claude.use("user");
  if (user) {
    S.me = await user.id();
    const cw = await user.can("data.write");
    if (cw === false) S.canWrite = false;
  }
  db = await claude.use("db");
  S.ready.db = !db;
  if (!db) { render(); return; }
  const onErr = () => {};
  db.doc("trip/main").onSnapshot(snap => { S.trip = snap.exists ? snap.data() : null; S.tripLoaded = true; scheduleRender(); }, onErr);
  db.collection("ideas").onSnapshot(snap => {
    S.ideas = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.db = true; scheduleRender();
  }, onErr);
  db.collection("stops").onSnapshot(snap => { S.stops = snap.docs.map(d => ({ id: d.id, ...d.data() })); scheduleRender(); }, onErr);
  db.collection("comments").onSnapshot(snap => { S.comments = snap.docs.map(d => ({ id: d.id, ...d.data() })); scheduleRender(); }, onErr);
  db.collection("members").onSnapshot(snap => { S.members = snap.docs.map(d => ({ id: d.id, ...d.data() })); scheduleRender(); ensureMember(); }, onErr);

  room = await claude.use("room");
  if (room) {
    room.presence({ tab: S.tab }).catch(() => {});
    room.onPeers(({ peers }) => {
      S.peers = [...new Set(peers.filter(p => p.kind === "viewer" && p.by).map(p => p.by))];
      scheduleRender();
    }, () => {});
  }
})();
