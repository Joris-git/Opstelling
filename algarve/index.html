<title>Rota Algarve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header with azulejo band, tab bar (bottom on phone, top on desktop), one view at a time, slide-over sheet for detail. */
:root{
  --bg:#F3F6F7;          /* whitewash with a hint of Atlantic */
  --surface:#FFFFFF;
  --sunken:#E8EEF0;
  --ink:#14232C;
  --muted:#5A6B74;
  --line:#D5DEE2;
  --azulejo:#2348A6;     /* cobalt tile blue — primary */
  --azulejo-soft:#E3E9F8;
  --ochre:#D7832F;       /* Ponta da Piedade sandstone — accent */
  --ochre-soft:#FBEBDB;
  --sea:#0E7A83;         /* planned */
  --sea-soft:#DDF1F2;
  --ok:#2E7D4F;          /* booked */
  --ok-soft:#DFF2E6;
  --no:#B3412F;
  --no-soft:#F8E1DC;
  --shadow:0 1px 2px rgba(20,35,44,.06),0 6px 20px rgba(20,35,44,.06);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E171C;--surface:#16222A;--sunken:#1D2C35;--ink:#E7EEF1;--muted:#93A6AF;--line:#2A3C46;
  --azulejo:#7F9DF0;--azulejo-soft:#1E2B4D;--ochre:#EFA25A;--ochre-soft:#3A2814;
  --sea:#4FC1C9;--sea-soft:#123437;--ok:#6CC892;--ok-soft:#163323;--no:#F08A78;--no-soft:#3C1E19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171C;--surface:#16222A;--sunken:#1D2C35;--ink:#E7EEF1;--muted:#93A6AF;--line:#2A3C46;
  --azulejo:#7F9DF0;--azulejo-soft:#1E2B4D;--ochre:#EFA25A;--ochre-soft:#3A2814;
  --sea:#4FC1C9;--sea-soft:#123437;--ok:#6CC892;--ok-soft:#163323;--no:#F08A78;--no-soft:#3C1E19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--azulejo)}
:focus-visible{outline:2px solid var(--azulejo);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.tiles{height:10px;background-color:var(--azulejo);
  background-image:
    radial-gradient(circle at 50% 50%,var(--bg) 0 2px,transparent 2.5px),
    linear-gradient(45deg,transparent 42%,var(--bg) 42% 58%,transparent 58%),
    linear-gradient(-45deg,transparent 42%,var(--bg) 42% 58%,transparent 58%);
  background-size:20px 10px;opacity:.9}
.bar{max-width:1080px;margin:0 auto;padding:12px 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand h1{font-size:24px;white-space:nowrap}
.brand .tripname{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crew{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);background:var(--sunken);object-fit:cover;flex:none;position:relative}
.crew .avwrap{position:relative;margin-left:-8px}
.crew .avwrap:first-child{margin-left:0}
.crew .online::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.crew .more{margin-left:6px;font-size:12.5px;color:var(--muted)}

.tabs{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 12px 11px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ochre)}
.tab .count{background:var(--ochre);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}

main{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
.view{display:flex;flex-direction:column;gap:20px}

@media (max-width:720px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;max-width:none;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;border-bottom:0;border-top:2px solid transparent;position:relative;flex:1}
  .tab[aria-selected="true"]{border-top-color:var(--ochre)}
  .tab .count{position:absolute;top:2px;left:55%}
  .brand h1{font-size:21px}
}

/* ---------- generic pieces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg,.chip svg,.linkish svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--azulejo);border-color:var(--azulejo);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.voorstel{background:var(--ochre-soft);color:var(--ochre)}
.pill.gepland{background:var(--sea-soft);color:var(--sea)}
.pill.geboekt{background:var(--ok-soft);color:var(--ok)}
.pill.afgevallen{background:var(--sunken);color:var(--muted)}
.pill.claude{background:var(--azulejo-soft);color:var(--azulejo)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.cat svg{width:14px;height:14px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--azulejo-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--azulejo)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:4px}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-h h2{font-size:22px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.countdown{padding:20px;position:relative;overflow:hidden}
.countdown .big{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--azulejo)}
.countdown .big small{font-size:20px;color:var(--ink);margin-left:6px}
.countdown .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.countdown .meta div{min-width:0}
.countdown .meta b{display:block;font-size:17px;font-weight:600}
.countdown .cliff{position:absolute;right:-10px;bottom:-6px;width:170px;height:auto;opacity:.9;pointer-events:none}
@media (max-width:480px){.countdown .cliff{width:110px;opacity:.45}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px}
.stat b{font-family:var(--f-display);font-size:30px;line-height:1.1;display:block}
.stat.s1 b{color:var(--ochre)}.stat.s2 b{color:var(--sea)}.stat.s3 b{color:var(--ok)}
.budget{padding:14px;grid-column:1/-1}
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin-top:8px;display:flex}
.meter i{display:block;height:100%}
.home-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.home-grid{grid-template-columns:minmax(0,1fr)}}
.todo-list,.feed{display:flex;flex-direction:column}
.todo{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo .t{flex:1;min-width:0}
.todo .t>*{display:block;max-width:100%}
.todo .t .linkish{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .item{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;align-items:flex-start}
.feed .item:first-child{border-top:0}
.feed .item .av{width:24px;height:24px;border:0}
.feed .item .txt{min-width:0;flex:1}
.feed .item .txt q{quotes:none;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkish:hover{text-decoration-color:var(--ink)}
.climate{padding:14px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.climate div b{font-size:20px;font-weight:700;display:block}

/* ---------- vote control ---------- */
.vote{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.vote button{border:0;background:none;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);display:flex;gap:5px;align-items:center}
.vote button+button{border-left:1px solid var(--line)}
.vote button[aria-pressed="true"].ja{background:var(--ok-soft);color:var(--ok)}
.vote button[aria-pressed="true"].mis{background:var(--ochre-soft);color:var(--ochre)}
.vote button[aria-pressed="true"].nee{background:var(--no-soft);color:var(--no)}
.vote button:disabled{cursor:not-allowed}
.tally{display:flex;height:5px;border-radius:9px;overflow:hidden;background:var(--sunken);min-width:60px}
.tally i{display:block;height:100%}
.tally .j{background:var(--ok)}.tally .m{background:var(--ochre)}.tally .n{background:var(--no)}

/* ---------- board ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;min-width:0;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;color:var(--muted)}
.chip svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.idea{display:flex;flex-direction:column;gap:10px;padding:14px;cursor:pointer;transition:border-color .15s,transform .15s}
.idea:hover{border-color:var(--muted)}
.idea.top1{border-color:var(--ochre)}
.idea h3{font-size:18px}
.idea .desc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.idea .facts{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.idea .facts span{display:inline-flex;gap:4px;align-items:center}
.idea .facts svg{width:14px;height:14px}
.idea.afgevallen{opacity:.6}
.who{display:flex}
.who .av{width:22px;height:22px;margin-left:-6px;border:2px solid var(--surface)}
.who .av:first-child{margin-left:0}

/* ---------- plan ---------- */
.plan{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.plan{grid-template-columns:minmax(0,1fr)}}
.pool{padding:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:120px}
@media (max-width:820px){.pool{position:static}}
.days{display:flex;flex-direction:column;gap:14px}
.day{padding:0;overflow:hidden}
.day-h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--sunken)}
.day-h .dnum{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--azulejo);min-width:34px}
.day-h .dname{font-weight:700}
.slot{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.slot:first-of-type{border-top:0}
.slot:hover{background:var(--sunken)}
.slot .time{font-weight:700;width:46px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}
.slot .what{flex:1;min-width:0}
.slot .what b{display:block;font-weight:600}
.day .none{padding:14px;color:var(--muted);font-size:14px}
.mini{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-size:14px}
.mini:hover{border-color:var(--muted)}
.mini svg{width:16px;height:16px;flex:none;color:var(--muted)}
.mini:disabled{opacity:.6;cursor:default}
.mini b{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drop-ok{outline:2px dashed var(--ochre);outline-offset:-2px}

/* ---------- book ---------- */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bk{padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink)}
.bk:hover{border-color:var(--azulejo)}
.bk .bk-h{display:flex;align-items:center;gap:8px;font-weight:700}
.bk .bk-h svg{width:18px;height:18px;color:var(--azulejo)}
.bk p{margin:0;color:var(--muted);font-size:13.5px}
.bk .go{margin-top:auto;font-size:13px;font-weight:600;color:var(--azulejo)}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.region{padding:14px;display:flex;flex-direction:column;gap:8px}
.region h3{font-size:19px}
.region p{margin:0;color:var(--muted);font-size:14px}
.region .row{margin-top:auto}
.tripform{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:end}

/* ---------- claude ---------- */
.ai{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.ai{grid-template-columns:minmax(0,1fr)}}
.presets{display:flex;flex-direction:column;gap:8px}
.preset{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.preset:hover{border-color:var(--azulejo)}
.preset svg{width:20px;height:20px;color:var(--azulejo);flex:none;margin-top:1px}
.preset b{display:block}
.preset span{font-size:13px;color:var(--muted)}
.chat{display:flex;flex-direction:column;min-height:420px}
.msgs{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:62vh}
.msg{max-width:92%;min-width:0}
.msg.me{align-self:flex-end;background:var(--azulejo);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px}
.msg.bot{align-self:flex-start}
.msg.bot .bubble{background:var(--sunken);border-radius:16px 16px 16px 4px;padding:11px 14px;overflow-wrap:anywhere}
.msg.bot .bubble h4{margin:10px 0 4px;font-size:15px}
.msg.bot .bubble p{margin:6px 0}
.msg.bot .bubble ul{margin:6px 0;padding-left:20px}
.msg .thinking{display:inline-flex;gap:4px}
.msg .thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.msg .thinking i:nth-child(2){animation-delay:.2s}.msg .thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.msg .thinking i{animation:none;opacity:.6}}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;min-height:42px;max-height:140px}
.sugg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.sugg{padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sugg b{font-weight:700}
.sugg p{margin:0;font-size:13.5px;color:var(--muted)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,26,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:0 0 env(safe-area-inset-bottom,0px);box-shadow:-10px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
@media (max-width:720px){.scrim{align-items:flex-end}.sheet{height:92%;border-radius:18px 18px 0 0}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:14px 18px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;z-index:2}
.sheet-h h2{font-size:24px;flex:1;min-width:0;overflow-wrap:anywhere}
.sheet-b{padding:16px 18px 32px;display:flex;flex-direction:column;gap:18px}
.iconbtn{border:0;background:var(--sunken);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.kv b{display:block;font-weight:600;overflow-wrap:anywhere}
.voters{display:flex;flex-direction:column;gap:6px}
.voters .vrow{display:flex;gap:8px;align-items:center;font-size:14px}
.voters .vrow .av{width:24px;height:24px;border:0}
.thread{display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt .av{width:28px;height:28px;border:0}
.cmt .body{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.cmt .body p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cmt.suggestion .body{border-color:var(--ochre);background:var(--ochre-soft)}
.cmt.suggestion.done .body{border-color:var(--line);background:var(--surface)}
.change{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:13px}
.change span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px}
.change del{color:var(--muted)}
form.f{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;display:inline-flex;gap:5px;align-items:center;background:var(--surface);cursor:pointer;color:var(--muted)}
.seg span svg{width:14px;height:14px}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--azulejo);outline-offset:2px}
.tabs2{display:flex;gap:6px}

<script>
/* ================================================================
   Rota Algarve — samen een reis plannen zonder groepsapp-chaos.
   Shared state lives in the artifact db:
     trip/main                 reis-instellingen
     ideas/{id}                voorstellen (votes: {uid:"ja"|"mis"|"nee"})
     comments/{id}             reacties + wijzigingsvoorstellen (ideaId)
     members/{uid}             wie doet mee
   ================================================================ */

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
};

/* ---------- icons (inline, stroke) ---------- */
const P = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',

  check:'<path d="M5 12l5 5 9-10"/>',

  plane:'<path d="M2 13l20-8-6 16-4-6z"/><path d="M12 15l4-6"/>',
  ticket:'<path d="M3 8a2 2 0 0 0 0 4v4h18v-4a2 2 0 0 1 0-4V4H3z" transform="translate(0 2)"/>',
  map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  send:'<path d="M4 12l16-8-6 16-2-6z"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  rain:'<path d="M7 15a4 4 0 0 1 .5-8A5 5 0 0 1 17 8a3.5 3.5 0 0 1 0 7z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
};
const ic = (n, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ""}</svg>`;
const icEl = (n) => { const s = document.createElement("span"); s.style.display = "contents"; s.innerHTML = ic(n); return s; };

/* ---------- domain ---------- */
const CATS = {
  verblijf:  { label: "Verblijf",   icon: "bed" },
  activiteit:{ label: "Activiteit", icon: "boot" },
  strand:    { label: "Strand",     icon: "wave" },
  eten:      { label: "Eten & drinken", icon: "fork" },
  natuur:    { label: "Natuur",     icon: "hike" },
  vervoer:   { label: "Vervoer",    icon: "car" },
  avond:     { label: "Avond uit",  icon: "moon" },
  overig:    { label: "Overig",     icon: "dots" }
};
const STATUS = {
  voorstel:  "Voorstel",
  gepland:   "Ingepland",
  geboekt:   "Geboekt",
  afgevallen:"Afgevallen"
};
const VOTE = { ja: "Ja!", mis: "Misschien", nee: "Nee" };

/* Faro climate: avg day max °C, sea °C (Lagos), sun hours/day */
const CLIMATE = [
  [16,16,5],[17,15,6],[19,16,7],[21,16,9],[23,17,10],[27,19,12],
  [29,20,12],[29,21,11],[27,21,9],[23,20,7],[19,18,6],[17,17,5]
];
const MONTHS = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
const DOW = ["zo","ma","di","wo","do","vr","za"];
const DOWL = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];

/* Built-in inspiration: real places, one tap to put on the board */
const REGIONS = [
  { name: "Lagos", tag: "Westkust", text: "Gezellige oude stad, Ponta da Piedade-kliffen en Praia do Camilo. Goede uitvalsbasis voor een groep.",
    ideas: [
      { title: "Kajakken langs Ponta da Piedade", category: "activiteit", place: "Lagos", cost: 35, description: "Peddelen door grotten en bogen in de goudkleurige kliffen. Ochtend is het rustigst op het water." },
      { title: "Trap af naar Praia do Camilo", category: "strand", place: "Lagos", cost: 0, description: "Ruim 200 houten treden naar een klein strand tussen de rotsen. Vroeg gaan, het wordt druk." }
    ] },
  { name: "Sagres", tag: "Zuidwestpunt", text: "Ruig, surferig en winderig. Cabo de São Vicente bij zonsondergang is een klassieker.",
    ideas: [
      { title: "Zonsondergang bij Cabo de São Vicente", category: "natuur", place: "Sagres", cost: 0, description: "Het meest zuidwestelijke punt van Europa. Neem een trui mee, het waait altijd." },
      { title: "Surfles op Praia do Tonel", category: "activiteit", place: "Sagres", cost: 45, description: "Groepsles van 2 à 3 uur, plank en wetsuit inbegrepen. Ook voor beginners." }
    ] },
  { name: "Benagil & Carvoeiro", tag: "Middenkust", text: "De beroemde Benagil-grot en het kliffenpad Seven Hanging Valleys.",
    ideas: [
      { title: "Bootje naar de Benagil-grot", category: "activiteit", place: "Benagil", cost: 30, description: "De grot zelf mag je niet meer in zwemmen of peddelen; je bekijkt hem vanaf een boottour. Boek vooraf." },
      { title: "Wandelen: Seven Hanging Valleys", category: "natuur", place: "Carvoeiro", cost: 0, description: "Kustpad van ongeveer 6 km enkele reis tussen Praia da Marinha en Vale Centeanes." }
    ] },
  { name: "Albufeira", tag: "Uitgaan", text: "Druk en toeristisch, maar wel dé plek voor een avond los op de Strip.",
    ideas: [
      { title: "Avond op de Strip in Albufeira", category: "avond", place: "Albufeira", cost: 40, description: "Bars en clubs aan de Avenida Sá Carneiro. Taxi terug regelen." }
    ] },
  { name: "Tavira & Ria Formosa", tag: "Oostkust", text: "Rustiger, authentiek, lagunes en eilandstranden met een pontje.",
    ideas: [
      { title: "Pontje naar Ilha de Tavira", category: "strand", place: "Tavira", cost: 3, description: "Lang zandstrand op een eiland in de Ria Formosa. Pontje vertrekt uit Tavira of Quatro Águas." },
      { title: "Cataplana eten in Tavira", category: "eten", place: "Tavira", cost: 25, description: "Stoofpot met vis en schelpdieren uit een koperen pan. Ideaal om met de hele groep te delen." }
    ] },
  { name: "Monchique", tag: "Binnenland", text: "Groene heuvels, Fóia (902 m) en medronho-likeur. Fijn als het strandweer tegenvalt.",
    ideas: [
      { title: "Uitzicht vanaf Fóia", category: "natuur", place: "Monchique", cost: 0, description: "Hoogste punt van de Algarve. Op heldere dagen zie je de hele kust." },
      { title: "Piri-piri-kip in Guia", category: "eten", place: "Guia", cost: 15, description: "Guia staat bekend om frango piri-piri. Simpel, goedkoop, groepsproof." }
    ] }
];

/* ---------- state ---------- */
const S = {
  tab: "home",
  me: null,               // viewer id
  canWrite: true,
  trip: null,             // trip/main body
  tripLoaded: false,
  ideas: [],              // [{id, ...data}]
  comments: [],
  members: [],
  peers: [],              // live online ids
  profiles: {},
  filter: "alle",
  sort: "stemmen",
  showClosed: false,
  open: null,             // idea id in sheet
  modal: null,            // "new" | "edit" | "trip"
  editDraft: null,
  chat: [],               // [{role, content, cards?}]
  aiBusy: false,
  ready: { db: false }
};
let db = null, user = null, sample = null, room = null;
let aiCtl = null;

try { const t = localStorage.getItem("rota-tab"); if (t) S.tab = t; } catch (e) {}

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => Date.now();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const parseDate = (s) => { if (!s) return null; const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtDay = (s) => { const d = parseDate(s); return d ? `${DOWL[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}` : ""; };
const fmtShort = (s) => { const d = parseDate(s); return d ? `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}` : ""; };
const ago = (t) => {
  const s = Math.max(1, Math.round((now() - t) / 1000));
  if (s < 60) return "net";
  if (s < 3600) return `${Math.round(s / 60)} min geleden`;
  if (s < 86400) return `${Math.round(s / 3600)} uur geleden`;
  const d = Math.round(s / 86400); return d === 1 ? "gisteren" : `${d} dagen geleden`;
};
const euro = (n) => n == null || n === "" || isNaN(n) ? "—" : `€ ${Math.round(Number(n)).toLocaleString("nl-NL")}`;
const tripDays = () => {
  const a = parseDate(S.trip?.start), b = parseDate(S.trip?.end);
  if (!a || !b || b < a) return [];
  const out = []; for (let d = new Date(a); d <= b && out.length < 31; d.setDate(d.getDate() + 1)) out.push(iso(d));
  return out;
};
const groupSize = () => Math.max(1, Number(S.trip?.travelers) || S.members.length || 4);
const nameOf = (id) => {
  if (!id) return "Rota";
  if (id === "claude") return "Claude";
  const p = S.profiles[id]; return (p && p.name) || (id === S.me ? "Jij" : "Iemand");
};
const firstName = (id) => id === S.me ? "jij" : nameOf(id).split(" ")[0];
const avatar = (id, cls = "av") => {
  const p = S.profiles[id];
  if (id && id !== "claude" && !p) return h("span", { class: cls, title: nameOf(id), style: "display:inline-block;background:var(--line)" });
  if (id === "claude" || !id) {
    const el = h("span", { class: cls, title: nameOf(id), style: `display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:${id === "claude" ? "var(--ochre)" : "var(--azulejo)"}` }, id === "claude" ? "C" : "R");
    return el;
  }
  return h("img", { class: cls, src: p.avatarUrl, alt: "", title: nameOf(id), style: `background:${p.color}` });
};
const votesOf = (idea) => {
  const v = idea.votes || {}; const r = { ja: [], mis: [], nee: [] };
  for (const [k, val] of Object.entries(v)) if (r[val]) r[val].push(k);
  return r;
};
const score = (idea) => { const v = votesOf(idea); return v.ja.length * 2 + v.mis.length - v.nee.length * 2; };
const commentsFor = (id) => S.comments.filter(c => c.ideaId === id).sort((a, b) => a.createdAt - b.createdAt);
const openSuggestions = (id) => commentsFor(id).filter(c => c.kind === "suggestie" && !c.resolved);

let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Gekopieerd"); return true; }
  catch (e) { toast("Kopiëren lukte niet. Selecteer de tekst handmatig."); return false; }
}

/* ---------- writes ---------- */
function guardWrite() {
  if (!db) { toast("Opslaan kan alleen in de gedeelde versie op claude.ai."); return false; }
  if (!S.canWrite) { toast("Je kunt alleen meekijken. Vraag de organisator om je als bewerker uit te nodigen."); return false; }
  return true;
}
async function write(fn, okMsg) {
  if (!guardWrite()) return false;
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    if (e && e.code === "invalid_argument") { S.canWrite = false; render(); toast("Je hebt geen schrijfrechten op deze reis."); }
    else if (e && e.code === "quota_exceeded") toast("De reis zit vol. Ruim oude voorstellen op en probeer opnieuw.");
    else toast("Opslaan mislukt. Probeer het zo nog eens.");
    return false;
  }
}
async function ensureMember() {
  if (!db || !S.me || !S.canWrite) return;
  if (S.members.some(m => m.id === S.me)) return;
  try { await db.doc("members/" + S.me).set({ joinedAt: now() }); } catch (e) {}
}
const addIdea = (data) => write(() => db.collection("ideas").doc(uid()).set({
  title: data.title, description: data.description || "", category: data.category || "overig",
  place: data.place || "", cost: data.cost === "" || data.cost == null ? null : Number(data.cost),
  link: data.link || "", day: data.day || "", time: data.time || "",
  status: data.day ? "gepland" : "voorstel", author: data.author || S.me, createdAt: now(), updatedAt: now(),
  votes: data.author === "claude" || !S.me ? {} : { [S.me]: "ja" }
}), "Voorstel staat op het bord");
const patchIdea = (id, patch, msg) => write(() => db.doc("ideas/" + id).update({ ...patch, updatedAt: now(), updatedBy: S.me }), msg);
const castVote = (id, val) => {
  const idea = S.ideas.find(i => i.id === id); if (!idea || !S.me) return;
  const cur = idea.votes?.[S.me];
  // optimistic so the button responds instantly
  const votes = { ...(idea.votes || {}) }; if (cur === val) delete votes[S.me]; else votes[S.me] = val;
  S.ideas = S.ideas.map(i => i.id === id ? { ...i, votes } : i); render();
  return write(() => db.doc("ideas/" + id).update({ votes: { [S.me]: cur === val ? null : val } }));
};
const addComment = (ideaId, text, kind = "reactie", changes = null) => write(() => db.collection("comments").doc(uid()).set({
  ideaId, text, kind, changes, author: S.me, createdAt: now(), resolved: false
}), kind === "suggestie" ? "Suggestie geplaatst" : null);

/* ---------- render: shell ---------- */
const TABS = [
  { id: "home", label: "Overzicht", icon: "home" },
  { id: "ideas", label: "Ideeën", icon: "bulb" },
  { id: "plan", label: "Planning", icon: "cal" },
  { id: "book", label: "Boeken", icon: "bag" },
  { id: "ai", label: "Claude", icon: "spark" }
];
function myTodo() {
  if (!S.me) return [];
  return S.ideas.filter(i => i.status !== "afgevallen" && !(i.votes && i.votes[S.me]));
}
function renderTabs() {
  const nav = $("#tabs"); nav.innerHTML = "";
  const todo = myTodo().length;
  for (const t of TABS) {
    const b = h("button", { class: "tab", role: "tab", "aria-selected": String(S.tab === t.id), type: "button", onclick: () => setTab(t.id) });
    b.innerHTML = ic(t.icon) + `<span>${t.label}</span>` + (t.id === "ideas" && todo ? `<span class="count num" aria-label="${todo} wachten op jouw stem">${todo}</span>` : "");
    nav.append(b);
  }
}
function setTab(t) {
  S.tab = t; try { localStorage.setItem("rota-tab", t); } catch (e) {}
  room?.presence({ tab: t }).catch(() => {});
  render(); window.scrollTo({ top: 0 });
}
function renderHeader() {
  $("#tripname").textContent = S.trip?.name ? `· ${S.trip.name}` : "";
  const crew = $("#crew"); crew.innerHTML = "";
  const ids = [...new Set([...S.members.map(m => m.id), ...S.peers])];
  const online = new Set(S.peers);
  ids.sort((a, b) => (online.has(b) - online.has(a)));
  ids.slice(0, 6).forEach(id => {
    const w = h("span", { class: "avwrap" + (online.has(id) ? " online" : "") }, avatar(id));
    w.title = nameOf(id) + (online.has(id) ? " · nu online" : "");
    crew.append(w);
  });
  if (ids.length > 6) crew.append(h("span", { class: "more" }, `+${ids.length - 6}`));
  if (S.peers.length > 1) crew.append(h("span", { class: "more" }, `${S.peers.length} online`));
  const fab = $("#fab");
  fab.innerHTML = ic("plus") + "<span>Nieuw voorstel</span>";
  fab.hidden = S.tab === "ai" || S.tab === "book";
  fab.onclick = () => openModal("new");
}
function render() {
  renderTabs(); renderHeader();
  const main = $("#main");
  const act = document.activeElement;
  const focusId = act && main.contains(act) ? act.id : null;
  const kept = {}; main.querySelectorAll("input[id],textarea[id]").forEach(el => kept[el.id] = [el.value, el.selectionStart, el.selectionEnd]);
  main.innerHTML = "";
  const v = h("div", { class: "view" });
  if (!db && S.ready.db) v.append(banner("Deze pagina werkt samen met je reisgenoten via claude.ai. Hier zie je hem zonder opslag: je kunt rondkijken maar niets bewaren."));
  else if (db && !S.canWrite) v.append(banner("Je kijkt mee. Om te stemmen en voorstellen te doen moet de organisator je uitnodigen als bewerker (Delen → uitnodigen per e-mail)."));
  ({ home: viewHome, ideas: viewIdeas, plan: viewPlan, book: viewBook, ai: viewAI }[S.tab] || viewHome)(v);
  main.append(v);
  for (const [id, [val, a, b]] of Object.entries(kept)) { const el = document.getElementById(id); if (el && !el.disabled) el.value = val; }

function mdLite(text) {

    l = l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    if (/^\s*[-*•]\s+/.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${l.replace(/^\s*[-*•]\s+/, "")}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (/^#{1,4}\s+/.test(l)) out += `<h4>${l.replace(/^#{1,4}\s+/, "")}</h4>`;
    else if (l.trim()) out += `<p>${l}</p>`;
  }
  if (inList) out += "</ul>";
  return out;
}

  if (i.status === "geboekt") act.append(h("button", { class: "btn small ghost", type: "button", onclick: () => patchIdea(i.id, { status: i.day ? "gepland" : "voorstel", bookedBy: null }, "Boeking teruggezet") }, "Toch niet geboekt"));
  if (i.status !== "afgevallen") act.append(h("button", { class: "btn small ghost", type: "button", onclick: () => patchIdea(i.id, { status: "afgevallen", day: "" }, "Idee valt af") }, "Laat afvallen"));
  else act.append(h("button", { class: "btn small", type: "button", onclick: () => patchIdea(i.id, { status: "voorstel" }, "Weer op het bord") }, "Terug op het bord"));
  act.append(h("button", { class: "btn small ghost", type: "button", onclick: () => openModal("edit", { id: i.id }) }, icEl("edit"), i.author && i.author !== S.me && i.author !== "claude" ? "Stel wijziging voor" : "Bewerk"));
  b.append(act);

  // links
  const L = bookingLinks({ q: i.title, place: i.place });
  const links = h("div", { class: "row" });
  if (i.link) links.append(h("a", { class: "btn small primary", href: i.link, target: "_blank", rel: "noopener" }, icEl("link"), "Open link"));
  if (i.category === "verblijf") links.append(h("a", { class: "btn small", href: bookingLinks({ place: i.place }).booking, target: "_blank", rel: "noopener" }, "Booking.com"), h("a", { class: "btn small", href: bookingLinks({ place: i.place }).airbnb, target: "_blank", rel: "noopener" }, "Airbnb"));
  else if (["activiteit", "natuur", "strand"].includes(i.category)) links.append(h("a", { class: "btn small", href: L.gyg, target: "_blank", rel: "noopener" }, "GetYourGuide"));
  if (i.category === "eten" || i.category === "avond") links.append(h("a", { class: "btn small", href: L.tripadvisor, target: "_blank", rel: "noopener" }, "Tripadvisor"));
  links.append(h("a", { class: "btn small", href: L.maps, target: "_blank", rel: "noopener" }, icEl("map"), "Kaart"));
  b.append(h("section", {}, h("div", { class: "label", style: "margin-bottom:8px" }, "Bekijken & boeken"), links));

  // thread
  const thr = h("section", {}, h("div", { class: "label", style: "margin-bottom:8px" }, "Reacties & suggesties"));
  const list = h("div", { class: "thread" });
  const cs = commentsFor(i.id);
  if (!cs.length) list.append(h("div", { class: "small muted" }, "Nog geen reacties. Twijfel je, of heb je een beter idee? Zeg het hier in plaats van in de groepsapp."));
  cs.forEach(c => list.append(commentEl(c, i)));
  thr.append(list);
  const form = h("form", { class: "f", style: "margin-top:10px", onsubmit: async (e) => {
    e.preventDefault(); const ta = $("#cmt-text"); const t = ta.value.trim(); if (!t) return;
    const ok = await addComment(i.id, t, "reactie"); if (ok) ta.value = "";
  } });
  form.append(h("div", { class: "field" }, h("label", { for: "cmt-text" }, "Reageer"), h("textarea", { id: "cmt-text", rows: "2", placeholder: "Bijv. ‘Liever ’s ochtends, dan is het rustiger’" })));
  form.append(h("div", { class: "row" }, h("button", { class: "btn primary small", type: "submit" }, "Plaats reactie"),
    h("button", { class: "btn small", type: "button", onclick: () => openModal("edit", { id: i.id }) }, "Stel een wijziging voor"),
    sample ? h("button", { class: "btn small ghost", type: "button", onclick: () => askAboutIdea(i) }, icEl("spark"), "Tips van Claude") : null));
  thr.append(form);
  b.append(thr);

  // delete (author only)
  if (i.author === S.me || (i.author === "claude" && S.canWrite)) {
    const del = h("div", {});
    const btn = h("button", { class: "btn small ghost", type: "button", style: "color:var(--no)", onclick: () => {
      del.innerHTML = "";
      del.append(h("div", { class: "confirm" }, "Voorstel en reacties verwijderen?", h("span", { class: "spacer" }),
        h("button", { class: "btn small", type: "button", onclick: () => renderOverlay() }, "Annuleer"),
        h("button", { class: "btn small primary", type: "button", style: "background:var(--no);border-color:var(--no)", onclick: async () => {
          const ok = await write(async () => { for (const c of cs) await db.doc("comments/" + c.id).delete(); await db.doc("ideas/" + i.id).delete(); }, "Verwijderd");
          if (ok) closeOverlay();
        } }, "Verwijder")));
    } });
    btn.innerHTML = ic("trash") + "Verwijder voorstel";
    del.append(btn); b.append(del);
  }
  sheet.append(b);
}
const FIELD_LABEL = { title: "titel", place: "plaats", cost: "kosten", day: "dag", time: "tijd", description: "omschrijving", category: "categorie", link: "link" };
const fmtVal = (k, v) => k === "day" ? (v ? fmtShort(v) : "geen dag") : k === "cost" ? (v === "" || v == null ? "—" : euro(v)) : k === "category" ? (CATS[v]?.label || v) : (v || "—");
function commentEl(c, idea) {
  const done = c.kind === "suggestie" && c.resolved;
  const el = h("div", { class: "cmt" + (c.kind === "suggestie" ? " suggestion" : "") + (done ? " done" : "") });
  const body = h("div", { class: "body" });
  body.append(h("div", { class: "row small" }, h("b", {}, firstName(c.author).replace(/^jij$/, "Jij")),
    c.kind === "suggestie" ? h("span", { class: "pill voorstel" }, done ? (c.resolved === "accepted" ? "Doorgevoerd" : "Afgewezen") : "Wijzigingsvoorstel") : null,
    h("span", { class: "muted" }, ago(c.createdAt))));
  if (c.text) body.append(h("p", {}, c.text));
  if (c.changes) {
    const ch = h("div", { class: "change" });
    for (const [k, val] of Object.entries(c.changes)) {
      const s = h("span", {}); s.append(`${FIELD_LABEL[k] || k}: `, h("del", {}, fmtVal(k, idea[k])), " → ", h("b", {}, fmtVal(k, val))); ch.append(s);
    }
    body.append(ch);
  }
  if (c.kind === "suggestie" && !c.resolved) {
    const agree = c.agree || {};
    const n = Object.keys(agree).filter(k => agree[k]).length;
    const row = h("div", { class: "row", style: "margin-top:8px" });
    row.append(h("button", { class: "btn small", type: "button", "aria-pressed": String(!!agree[S.me]), onclick: () => write(() => db.doc("comments/" + c.id).update({ agree: { [S.me]: agree[S.me] ? null : true } })) }, `Eens${n ? " · " + n : ""}`));
    if (idea.author === S.me || !idea.author || idea.author === "claude" || n >= 2) {
      row.append(h("button", { class: "btn small primary", type: "button", onclick: async () => {
        const ok = await write(async () => { await db.doc("ideas/" + idea.id).update({ ...(c.changes || {}), ...(c.changes?.day ? { status: idea.status === "geboekt" ? "geboekt" : "gepland" } : {}), updatedAt: now(), updatedBy: S.me }); await db.doc("comments/" + c.id).update({ resolved: "accepted", resolvedBy: S.me }); }, "Wijziging doorgevoerd");
      } }, "Doorvoeren"));
      row.append(h("button", { class: "btn small ghost", type: "button", onclick: () => write(() => db.doc("comments/" + c.id).update({ resolved: "rejected", resolvedBy: S.me }), "Suggestie afgewezen") }, "Afwijzen"));
    } else row.append(h("span", { class: "small muted" }, "Bij 2× eens of akkoord van de indiener wordt het doorgevoerd."));
    body.append(row);
  }
  el.append(avatar(c.author), body);
  return el;
}
async function askAboutIdea(i) {
  setTab("ai"); closeOverlay();
  if (!sample || S.aiBusy) return;
  const label = `Tips voor: ${i.title}`;
  S.chat.push({ role: "user", content: label, label });
  const msg = { role: "assistant", content: "", pending: true }; S.chat.push(msg); S.aiBusy = true; render();
  aiCtl = new AbortController();
  try {
    await sample(`Een vriendengroep overweegt dit in de Algarve: "${i.title}" (${i.category}, ${i.place || "plaats onbekend"}). ${i.description || ""}\nGroep: ${groupSize()} personen, data ${S.trip?.start || "onbekend"} t/m ${S.trip?.end || "onbekend"}.\nGeef in het Nederlands: 3 praktische tips (beste moment, reserveren, wat meenemen), een realistische prijsindicatie per persoon, en 2 alternatieven in de buurt voor wie niet mee wil. Kort en scanbaar.`,
      { signal: aiCtl.signal, onText: ({ text }) => { msg.content = text; msg.pending = false; updateLastMsg(); } });
  } catch (e) { msg.content = e?.text || msg.content; msg.error = aiErr(e); }
  finally { msg.pending = false; S.aiBusy = false; render(); }
}

function ideaForm(sheet) {
  const editing = S.modal === "edit" ? S.ideas.find(x => x.id === S.editDraft?.id) : null;
  const asSuggestion = !!(editing && editing.author && editing.author !== S.me && editing.author !== "claude");
  const d = editing || { category: S.editDraft?.category || "activiteit" };
  sheetHead(sheet, editing ? (asSuggestion ? "Wijziging voorstellen" : "Voorstel bewerken") : "Nieuw voorstel");
  const b = h("div", { class: "sheet-b" });
  if (asSuggestion) b.append(banner(`Dit is het voorstel van ${firstName(editing.author)}. Wat je aanpast wordt een suggestie die de groep kan steunen. Bij akkoord wordt het doorgevoerd.`));
  const f = h("form", { class: "f" });
  const seg = h("div", { class: "seg", role: "radiogroup", "aria-label": "Categorie" });
  for (const [k, c] of Object.entries(CATS)) {
    const id = "cat-" + k;
    const lab = h("label", { for: id });
    lab.append(h("input", { type: "radio", name: "category", id, value: k, checked: d.category === k || null }));
    const sp = h("span", {}); sp.innerHTML = ic(c.icon) + esc(c.label); lab.append(sp);
    seg.append(lab);
  }
  const fld = (id, label, input) => h("div", { class: "field" }, h("label", { for: id }, label), input);
  f.append(fld("f-title", "Wat?", h("input", { id: "f-title", name: "title", required: true, maxlength: "90", value: d.title || "", placeholder: "Bijv. Boottocht naar de Benagil-grot" })));
  f.append(h("div", { class: "field" }, h("span", { class: "small", style: "font-weight:600" }, "Soort"), seg));
  f.append(h("div", { class: "two" },
    fld("f-place", "Waar", h("input", { id: "f-place", name: "place", value: d.place || "", placeholder: "Lagos, Sagres, Tavira…" })),
    fld("f-cost", "Kosten per persoon (€)", h("input", { id: "f-cost", name: "cost", type: "number", min: "0", step: "1", inputmode: "numeric", value: d.cost ?? "" }))));
  const days = tripDays();
  const daySel = h("select", { id: "f-day", name: "day" }, h("option", { value: "" }, days.length ? "Nog niet" : "Eerst reisdata instellen"));
  days.forEach(x => daySel.append(h("option", { value: x, selected: d.day === x || null }, fmtShort(x))));
  f.append(h("div", { class: "two" }, fld("f-day", "Dag", daySel), fld("f-time", "Tijd", h("input", { id: "f-time", name: "time", type: "time", value: d.time || "" }))));
  f.append(fld("f-link", "Link (Booking.com, Airbnb, GetYourGuide…)", h("input", { id: "f-link", name: "link", type: "url", value: d.link || "", placeholder: "https://" })));
  f.append(fld("f-desc", "Waarom is dit leuk?", h("textarea", { id: "f-desc", name: "description", rows: "3", maxlength: "800" }, d.description || "")));
  if (asSuggestion) f.append(fld("f-why", "Toelichting voor de groep", h("input", { id: "f-why", name: "why", placeholder: "Bijv. ’s ochtends is de zee rustiger" })));
  f.append(h("div", { class: "row" }, h("button", { class: "btn primary", type: "submit" }, editing ? (asSuggestion ? "Suggestie plaatsen" : "Opslaan") : "Op het bord zetten"),
    h("button", { class: "btn ghost", type: "button", onclick: () => editing ? openIdea(editing.id) : closeOverlay() }, "Annuleer")));
  f.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const vals = { title: fd.get("title").trim(), category: fd.get("category") || "overig", place: fd.get("place").trim(), cost: fd.get("cost"), day: fd.get("day"), time: fd.get("time"), link: fd.get("link").trim(), description: fd.get("description").trim() };
    if (!vals.title) return;
    if (vals.link && !/^https:\/\//i.test(vals.link)) { toast("Een link moet met https:// beginnen."); return; }
    vals.cost = vals.cost === "" ? null : Number(vals.cost);
    if (!editing) { if (await addIdea(vals)) closeOverlay(); return; }
    const changes = {};
    for (const k of Object.keys(vals)) { const a = editing[k] ?? (k === "cost" ? null : ""); if (String(a ?? "") !== String(vals[k] ?? "")) changes[k] = vals[k]; }
    if (!Object.keys(changes).length) { openIdea(editing.id); return; }
    if (asSuggestion) { if (await addComment(editing.id, (fd.get("why") || "").trim(), "suggestie", changes)) openIdea(editing.id); }
    else {
      if (changes.day !== undefined && editing.status !== "geboekt" && editing.status !== "afgevallen") changes.status = changes.day ? "gepland" : "voorstel";
      if (await patchIdea(editing.id, changes, "Opgeslagen")) openIdea(editing.id);
    }
  };
  b.append(f); sheet.append(b);
}

function tripForm(sheet) {
  sheetHead(sheet, "Reis instellen");
  const t = S.trip || {};
  const b = h("div", { class: "sheet-b" });
  const f = h("form", { class: "f" });
  const fld = (id, label, input, hint) => h("div", { class: "field" }, h("label", { for: id }, label), input, hint ? h("span", { class: "small muted" }, hint) : null);
  f.append(fld("t-name", "Naam van de reis", h("input", { id: "t-name", name: "name", maxlength: "60", value: t.name || "", placeholder: "Bijv. Algarve met de jaarclub" })));
  f.append(h("div", { class: "two" }, fld("t-start", "Heen", h("input", { id: "t-start", name: "start", type: "date", value: t.start || "", required: true })),
    fld("t-end", "Terug", h("input", { id: "t-end", name: "end", type: "date", value: t.end || "", required: true }))));
  const base = h("select", { id: "t-base", name: "base" });
  ["", "Lagos", "Sagres", "Portimão", "Carvoeiro", "Albufeira", "Vilamoura", "Faro", "Olhão", "Tavira"].forEach(x => base.append(h("option", { value: x, selected: (t.base || "") === x || null }, x || "Nog niet gekozen")));
  f.append(h("div", { class: "two" }, fld("t-base", "Uitvalsbasis", base), fld("t-from", "Vertrekluchthaven", h("input", { id: "t-from", name: "from", maxlength: "3", value: t.from || "AMS", style: "text-transform:uppercase" }), "IATA-code: AMS, EIN, RTM, BRU…")));
  f.append(h("div", { class: "two" }, fld("t-trav", "Aantal personen", h("input", { id: "t-trav", name: "travelers", type: "number", min: "1", max: "30", value: t.travelers || "" })),
    fld("t-bud", "Budget p.p. voor activiteiten (€)", h("input", { id: "t-bud", name: "budget", type: "number", min: "0", step: "10", value: t.budget || "" }))));
  f.append(fld("t-notes", "Wensen van de groep", h("textarea", { id: "t-notes", name: "notes", rows: "3", placeholder: "Bijv. niet te vroeg op, één keer goed uit eten, iemand is vegetariër" }, t.notes || ""), "Claude houdt hier rekening mee bij voorstellen."));
  f.append(h("div", { class: "row" }, h("button", { class: "btn primary", type: "submit" }, "Opslaan"), h("button", { class: "btn ghost", type: "button", onclick: closeOverlay }, "Annuleer")));
  f.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const data = { name: fd.get("name").trim(), start: fd.get("start"), end: fd.get("end"), base: fd.get("base"), from: (fd.get("from") || "AMS").trim().toUpperCase().slice(0, 3),
      travelers: fd.get("travelers") ? Number(fd.get("travelers")) : null, budget: fd.get("budget") ? Number(fd.get("budget")) : null, notes: fd.get("notes").trim(), updatedAt: now(), updatedBy: S.me };
    if (data.end < data.start) { toast("De terugreis ligt vóór de heenreis."); return; }
    if ((parseDate(data.end) - parseDate(data.start)) / 86400000 > 30) { toast("Maximaal 31 dagen, anders wordt de planning onoverzichtelijk."); return; }
    if (await write(() => db.doc("trip/main").set(data), "Reis opgeslagen")) closeOverlay();
  };
  b.append(f); sheet.append(b);
}

/* ---------- profiles ---------- */
let profT;
function refreshProfiles() {
  if (!user) return;
  clearTimeout(profT);
  profT = setTimeout(async () => {
    const ids = new Set([...S.members.map(m => m.id), ...S.peers]);
    S.ideas.forEach(i => { if (i.author && i.author !== "claude") ids.add(i.author); if (i.bookedBy) ids.add(i.bookedBy); Object.keys(i.votes || {}).forEach(k => ids.add(k)); });
    S.comments.forEach(c => c.author && ids.add(c.author));
    if (S.me) ids.add(S.me);
    const list = [...ids].filter(Boolean);
    if (!list.length) return;
    try { S.profiles = { ...S.profiles, ...(await user.profiles(list)) }; } catch (e) {}
    render();
  }, 60);
}

/* ---------- boot ---------- */
let rT;
function scheduleRender() { cancelAnimationFrame(rT); rT = requestAnimationFrame(() => { render(); refreshProfiles(); }); }

render();

(async function boot() {
  if (!window.claude?.use) { S.ready.db = true; S.ready.sample = true; render(); return; }
  claude.use("sample").then(s => { sample = s; S.ready.sample = true; if (S.tab === "ai") render(); });
  user = await claude.use("user");
  if (user) {
    S.me = await user.id();
    const cw = await user.can("data.write");
    if (cw === false) S.canWrite = false;
  }
  db = await claude.use("db");
  S.ready.db = !db;
  if (!db) { render(); return; }
  const onErr = () => {};
  db.doc("trip/main").onSnapshot(snap => { S.trip = snap.exists ? snap.data() : null; S.tripLoaded = true; scheduleRender(); }, onErr);
  db.collection("ideas").onSnapshot(snap => {
    S.ideas = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.db = true; scheduleRender();
  }, onErr);
  db.collection("comments").onSnapshot(snap => { S.comments = snap.docs.map(d => ({ id: d.id, ...d.data() })); scheduleRender(); }, onErr);
  db.collection("members").onSnapshot(snap => { S.members = snap.docs.map(d => ({ id: d.id, ...d.data() })); scheduleRender(); ensureMember(); }, onErr);

  room = await claude.use("room");
  if (room) {
    room.presence({ tab: S.tab }).catch(() => {});
    room.onPeers(({ peers }) => {
      S.peers = [...new Set(peers.filter(p => p.kind === "viewer" && p.by).map(p => p.by))];
      scheduleRender();
    }, () => {});
  }
})();
